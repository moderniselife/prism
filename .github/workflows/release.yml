# Release pipeline. Push a tag like `tui-v1.2.3` and this ships everything
# it can: TUI binaries + checksums, the GUI apps (mac .app zip, Windows
# single-file exe, Linux tarball), and — only where their secret exists —
# PyPI wheels, the npm package, the Homebrew tap casks, and a Winget PR.
#
# Design: the release itself plus all binaries need nothing but GITHUB_TOKEN,
# so a tag push always produces a downloadable release. Every registry that
# needs a secret is a gated job that skips silently until its token exists.
# Gate pattern: a `gate` step maps secret presence to an output (secrets
# can't be branched on any other way), publish steps check that output.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   TAP_GITHUB_TOKEN (classic, `repo`) — Homebrew tap pushes
#   NPM_TOKEN                            — npm publish rights
#   PYPI_API_TOKEN                       — the `prism-tui` PyPI project
#   WINGET_TOKEN (classic, `public_repo`) + fork of microsoft/winget-pkgs
# Winget's first version must be submitted by hand (komac); automation
# takes over from the second release onward.
name: Release

on:
  push:
    tags: ["tui-v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tui:
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac-app:
    needs: [create-release]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: ditto -c -k --keepParent build/Prism.app Prism.app.zip
      - run: gh release upload "${{ github.ref_name }}" Prism.app.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-gui:
    needs: [create-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained single-file exe
        run: dotnet publish windows/CursorProfiles.csproj -c Release -r win-x64 --self-contained -o gui/win-x64 /p:PublishSingleFile=true
      - run: gh release upload "${{ github.ref_name }}" gui/win-x64/Prism.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-gui:
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m py_compile linux/prism.py
      - run: tar -czf prism-linux.tar.gz linux/
      - run: gh release upload "${{ github.ref_name }}" prism-linux.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wheels:
    needs: [tui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, asset: prism-tui-darwin-arm64.tar.gz, plat: macosx_11_0_arm64 }
          - { os: macos-14, asset: prism-tui-darwin-amd64.tar.gz, plat: macosx_11_0_x86_64 }
          - { os: ubuntu-latest, asset: prism-tui-linux-amd64.tar.gz, plat: manylinux_2_17_x86_64 }
          - { os: ubuntu-latest, asset: prism-tui-linux-arm64.tar.gz, plat: manylinux_2_17_aarch64 }
          - { os: windows-latest, asset: prism-tui-windows-amd64.zip, plat: win_amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage binary and stamp version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#tui-v}"
          gh release download "$TAG" -p "${{ matrix.asset }}" -D assets --repo moderniselife/prism
          rm -rf wheelbuild stage && mkdir -p wheelbuild stage
          cp -r pypi/prism-tui/README.md pypi/prism-tui/pyproject.toml \
                pypi/prism-tui/setup.py pypi/prism-tui/prism_tui wheelbuild/
          mkdir -p wheelbuild/prism_tui/bin
          # Archives hold the binary plus a README — stage the binary only.
          tar -xf "assets/${{ matrix.asset }}" -C stage
          BIN=prism-tui; if [ "${{ runner.os }}" = Windows ]; then BIN=prism-tui.exe; fi
          cp "stage/$BIN" wheelbuild/prism_tui/bin/
          chmod +x wheelbuild/prism_tui/bin/"$BIN" 2>/dev/null || true
          python - "$VER" <<'EOF'
          import sys
          ver = sys.argv[1]
          p = "wheelbuild/pyproject.toml"
          s = open(p).read().replace('version = "0.0.0"', f'version = "{ver}"', 1)
          open(p, "w").write(s)
          p = "wheelbuild/prism_tui/__init__.py"
          s = open(p).read().replace('__version__ = "0.0.0"', f'__version__ = "{ver}"', 1)
          open(p, "w").write(s)
          EOF
      - name: Build wheel
        shell: bash
        run: |
          python -m pip install -U setuptools wheel
          cd wheelbuild && python setup.py -q bdist_wheel --plat-name "${{ matrix.plat }}" -d /tmp/wheeldist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.plat }}
          path: /tmp/wheeldist/*.whl
          retention-days: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi-publish:
    needs: [wheels]
    runs-on: ubuntu-latest
    steps:
      - id: gate
        run: '[ -n "${{ secrets.PYPI_API_TOKEN }}" ] && echo has=true >> "$GITHUB_OUTPUT" || echo has=false >> "$GITHUB_OUTPUT"'
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.has == 'true'
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.gate.outputs.has == 'true'
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  npm-publish:
    needs: [tui]
    runs-on: ubuntu-latest
    steps:
      - id: gate
        run: '[ -n "${{ secrets.NPM_TOKEN }}" ] && echo has=true >> "$GITHUB_OUTPUT" || echo has=false >> "$GITHUB_OUTPUT"'
      - uses: actions/checkout@v4
        if: steps.gate.outputs.has == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.has == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Stamp version and release tag
        if: steps.gate.outputs.has == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e 'const fs=require("fs"); const p="npm/prism-tui/package.json"; const j=JSON.parse(fs.readFileSync(p)); const tag=process.env.TAG; const ver=tag.replace(/^tui-v/,""); j.version=ver; j.prism.releaseTag=tag; fs.writeFileSync(p, JSON.stringify(j,null,2)+"\n");'
      - name: Publish
        if: steps.gate.outputs.has == 'true'
        run: npm publish --access public
        working-directory: npm/prism-tui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  tap-tui:
    # TUI cask in the Homebrew tap (GoReleaser's formula support is
    # deprecated upstream, so the tap is managed here like the app cask).
    needs: [tui]
    runs-on: ubuntu-latest
    steps:
      - id: gate
        run: '[ -n "${{ secrets.TAP_GITHUB_TOKEN }}" ] && echo has=true >> "$GITHUB_OUTPUT" || echo has=false >> "$GITHUB_OUTPUT"'
      - uses: actions/checkout@v4
        if: steps.gate.outputs.has == 'true'
      - name: Render and push cask
        if: steps.gate.outputs.has == 'true'
        env:
          TAG: ${{ github.ref_name }}
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${TAG#tui-v}"
          gh release download "$TAG" -p checksums.txt -D /tmp/tap --repo moderniselife/prism
          SHA_ARM=$(grep "prism-tui-darwin-arm64.tar.gz" /tmp/tap/checksums.txt | cut -d' ' -f1)
          SHA_INTEL=$(grep "prism-tui-darwin-amd64.tar.gz" /tmp/tap/checksums.txt | cut -d' ' -f1)
          sed -e "s/__VERSION__/$VER/" -e "s/__SHA_ARM__/$SHA_ARM/" -e "s/__SHA_INTEL__/$SHA_INTEL/" \
            packaging/homebrew-cask/prism-tui.rb > /tmp/prism-tui.rb
          rm -rf /tmp/taprepo && git clone \
            "https://x-access-token:${TAP_TOKEN}@github.com/moderniselife/homebrew-prism.git" /tmp/taprepo
          mkdir -p /tmp/taprepo/Casks && cp /tmp/prism-tui.rb /tmp/taprepo/Casks/prism-tui.rb
          cd /tmp/taprepo && git add Casks/prism-tui.rb
          git diff --cached --quiet || {
            git -c user.name="github-actions[bot]" \
                -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "prism-tui $VER" && git push
          }

  cask-update:
    # Prism.app cask in the tap.
    needs: [tui, mac-app]
    runs-on: macos-14
    steps:
      - id: gate
        run: '[ -n "${{ secrets.TAP_GITHUB_TOKEN }}" ] && echo has=true >> "$GITHUB_OUTPUT" || echo has=false >> "$GITHUB_OUTPUT"'
      - uses: actions/checkout@v4
        if: steps.gate.outputs.has == 'true'
      - name: Render and push cask
        if: steps.gate.outputs.has == 'true'
        env:
          TAG: ${{ github.ref_name }}
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${TAG#tui-v}"
          gh release download "$TAG" -p Prism.app.zip -D /tmp/cask --repo moderniselife/prism
          SHA=$(shasum -a 256 /tmp/cask/Prism.app.zip | cut -d' ' -f1)
          sed -e "s/__VERSION__/$VER/" -e "s/__SHA256__/$SHA/" \
            packaging/homebrew-cask/prism.rb > /tmp/prism.rb
          rm -rf /tmp/taprepo && git clone \
            "https://x-access-token:${TAP_TOKEN}@github.com/moderniselife/homebrew-prism.git" /tmp/taprepo
          mkdir -p /tmp/taprepo/Casks && cp /tmp/prism.rb /tmp/taprepo/Casks/prism.rb
          cd /tmp/taprepo && git add Casks/prism.rb
          git diff --cached --quiet || {
            git -c user.name="github-actions[bot]" \
                -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "prism $VER" && git push
          }

  winget:
    needs: [tui]
    runs-on: ubuntu-latest
    steps:
      - id: gate
        run: '[ -n "${{ secrets.WINGET_TOKEN }}" ] && echo has=true >> "$GITHUB_OUTPUT" || echo has=false >> "$GITHUB_OUTPUT"'
      - id: ver
        if: steps.gate.outputs.has == 'true'
        run: echo "version=${GITHUB_REF_NAME#tui-v}" >> "$GITHUB_OUTPUT"
      - uses: vedantmgoyal9/winget-releaser@main
        if: steps.gate.outputs.has == 'true'
        with:
          identifier: ModerniseLife.PrismTUI
          version: ${{ steps.ver.outputs.version }}
          installers-regex: 'prism-tui-windows-amd64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
