# Release pipeline. Push a tag like `v1.2.3` and this ships everything:
# TUI binaries + checksums, the prism-endpoint helper, the GUI apps (mac .app
# zip, Windows single-file exe, Linux tarball), the npm package and the PyPI
# wheels.
#
# npm and PyPI use trusted publishing: each registry trusts this workflow
# file (release.yml in moderniselife/prism) and accepts GitHub's OIDC token,
# so no registry tokens are stored. The Homebrew tap updates itself (its own
# sync workflow reads the latest release), so it needs nothing from here.
#
# Run it by hand (workflow_dispatch) with an existing tag to republish only
# the packages for that release; the build jobs skip.
#
# Winget stays gated on a WINGET_TOKEN secret (classic PAT, `public_repo`)
# plus a fork of microsoft/winget-pkgs; its first version must be submitted
# by hand (komac), after which this job takes over.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to republish packages for (e.g. v1.5.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gh release view "${{ env.TAG }}" >/dev/null 2>&1 || \
            gh release create "${{ env.TAG }}" --title "Prism ${{ env.TAG }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tui:
    if: github.event_name == 'push'
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  endpoint-helper:
    if: github.event_name == 'push'
    # prism-endpoint: the Endpoint for Windows, Linux and the terminal. The
    # Windows and Linux apps download these by name, so keep them stable.
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Cross-compile
        working-directory: tui
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p ../endpoint-dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${TAG#v}" \
              -o "../endpoint-dist/prism-endpoint-$os-$arch$ext" ./cmd/prism-endpoint
          done
          cd ../endpoint-dist && sha256sum prism-endpoint-* > prism-endpoint-checksums.txt
      - run: gh release upload "${{ env.TAG }}" endpoint-dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac-app:
    if: github.event_name == 'push'
    needs: [create-release]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: ditto -c -k --keepParent build/Prism.app Prism.app.zip
      - run: gh release upload "${{ env.TAG }}" Prism.app.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-gui:
    if: github.event_name == 'push'
    needs: [create-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained single-file exe
        run: dotnet publish windows/CursorProfiles.csproj -c Release -r win-x64 --self-contained -o gui/win-x64 /p:PublishSingleFile=true
      - run: gh release upload "${{ env.TAG }}" gui/win-x64/Prism.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-gui:
    if: github.event_name == 'push'
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp version
        run: sed -i "s/^PRISM_VERSION = .*/PRISM_VERSION = \"${TAG#v}\"  # stamped by the release workflow/" linux/prism.py
      - run: python3 -m py_compile linux/prism.py
      - run: tar -czf prism-linux.tar.gz linux/
      - run: gh release upload "${{ env.TAG }}" prism-linux.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wheels:
    needs: [tui]
    if: ${{ !cancelled() && (needs.tui.result == 'success' || needs.tui.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, asset: prism-tui-darwin-arm64.tar.gz, plat: macosx_11_0_arm64 }
          - { os: macos-15, asset: prism-tui-darwin-amd64.tar.gz, plat: macosx_11_0_x86_64 }
          - { os: ubuntu-latest, asset: prism-tui-linux-amd64.tar.gz, plat: manylinux_2_17_x86_64 }
          - { os: ubuntu-latest, asset: prism-tui-linux-arm64.tar.gz, plat: manylinux_2_17_aarch64 }
          - { os: windows-latest, asset: prism-tui-windows-amd64.zip, plat: win_amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stage binary and stamp version
        shell: bash
        env:
          # Authenticated: unauthenticated API calls share a per-IP limit
          # that busy macOS runners exhaust (HTTP 403 rate limit exceeded).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          gh release download "$TAG" -p "${{ matrix.asset }}" -D assets --repo moderniselife/prism
          rm -rf wheelbuild stage && mkdir -p wheelbuild stage
          cp -r pypi/prism-tui/README.md pypi/prism-tui/pyproject.toml \
                pypi/prism-tui/setup.py pypi/prism-tui/prism_tui wheelbuild/
          mkdir -p wheelbuild/prism_tui/bin
          # Archives hold the binary plus a README — stage the binary only.
          # Windows ships a .zip, which Git Bash's tar can't read: use Python.
          case "${{ matrix.asset }}" in
            *.zip) python -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
                     "assets/${{ matrix.asset }}" stage ;;
            *) tar -xf "assets/${{ matrix.asset }}" -C stage ;;
          esac
          BIN=prism-tui; if [ "${{ runner.os }}" = Windows ]; then BIN=prism-tui.exe; fi
          cp "stage/$BIN" wheelbuild/prism_tui/bin/
          chmod +x wheelbuild/prism_tui/bin/"$BIN" 2>/dev/null || true
          python - "$VER" <<'EOF'
          import sys
          ver = sys.argv[1]
          p = "wheelbuild/pyproject.toml"
          s = open(p).read().replace('version = "0.0.0"', f'version = "{ver}"', 1)
          open(p, "w").write(s)
          p = "wheelbuild/prism_tui/__init__.py"
          s = open(p).read().replace('__version__ = "0.0.0"', f'__version__ = "{ver}"', 1)
          open(p, "w").write(s)
          EOF
      - name: Build wheel
        shell: bash
        run: |
          python -m pip install -U setuptools wheel
          # Write into the workspace: on Windows, Git Bash's /tmp and the
          # /tmp that upload-artifact resolves are different folders.
          cd wheelbuild && python setup.py -q bdist_wheel --plat-name "${{ matrix.plat }}" -d ../wheeldist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.plat }}
          path: wheeldist/*.whl
          if-no-files-found: error
          retention-days: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi-publish:
    # Trusted publisher on PyPI: project prism-tui, owner moderniselife,
    # repository prism, workflow release.yml, no environment.
    needs: [wheels]
    if: ${{ !cancelled() && needs.wheels.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm-publish:
    # Trusted publisher on npm: package prism-tui, organisation/user
    # moderniselife, repository prism, workflow release.yml.
    needs: [tui]
    if: ${{ !cancelled() && (needs.tui.result == 'success' || needs.tui.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm with trusted publishing (11.5.1+)
        run: npm install -g npm@latest
      - name: Stamp version and release tag
        run: |
          node -e 'const fs=require("fs"); const p="npm/prism-tui/package.json"; const j=JSON.parse(fs.readFileSync(p)); const tag=process.env.TAG; const ver=tag.replace(/^v/,""); j.version=ver; j.prism.releaseTag=tag; fs.writeFileSync(p, JSON.stringify(j,null,2)+"\n");'
      - name: Publish
        working-directory: npm/prism-tui
        run: |
          VER="${TAG#v}"
          if npm view "prism-tui@$VER" version >/dev/null 2>&1; then
            echo "prism-tui@$VER is already on npm"
          else
            npm publish --access public --provenance
          fi

  winget:
    needs: [tui]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - id: gate
        run: '[ -n "${{ secrets.WINGET_TOKEN }}" ] && echo has=true >> "$GITHUB_OUTPUT" || echo has=false >> "$GITHUB_OUTPUT"'
      - id: ver
        if: steps.gate.outputs.has == 'true'
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: vedantmgoyal9/winget-releaser@main
        if: steps.gate.outputs.has == 'true'
        with:
          identifier: ModerniseLife.PrismTUI
          version: ${{ steps.ver.outputs.version }}
          installers-regex: 'prism-tui-windows-amd64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
