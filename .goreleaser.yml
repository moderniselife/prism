# GoReleaser: prism-tui binaries for every platform, Homebrew formula,
# checksums. Runs on version tags (v*) via .github/workflows/release.yml.
# Test locally without publishing: `goreleaser release --snapshot --clean`.
version: 2

project_name: prism-tui

builds:
  - id: prism-tui
    dir: ./tui
    binary: prism-tui
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    env:
      - CGO_ENABLED=0

archives:
  - id: tui
    ids: [prism-tui]
    # Deterministic names — the npm/pip installers construct these URLs.
    name_template: "prism-tui-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - src: tui/README.md
        dst: README.md

checksum:
  name_template: checksums.txt

# NOTE: no homebrew/winget/npm/pypi sections here on purpose. GoReleaser
# needs only GITHUB_TOKEN, so the binary release always succeeds; every
# registry that needs a secret lives in a gated job in release.yml and
# skips silently until its token exists.
